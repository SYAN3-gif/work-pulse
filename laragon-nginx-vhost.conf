# Laragon Nginx Virtual Host Configuration for WorkPulse
# Save to: C:\laragon\etc\nginx\sites-enabled\workpulse.test.conf
# After saving, right-click Laragon -> Nginx -> Reload

server {
    listen 80;
    server_name workpulse.test *.workpulse.test;
    root "C:/laragon/www/workpulse/dist";
    
    index index.html index.htm;
    charset utf-8;

    # SPA Routing: fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Enable gzip compression for speed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
    }

    access_log off;
    error_log "C:/laragon/tmp/workpulse_error.log";
}

