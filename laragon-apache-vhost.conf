# Laragon Apache Virtual Host Configuration for WorkPulse
# Save to: C:\laragon\etc\apache2\sites-enabled\workpulse.test.conf
# After saving, right-click Laragon -> Apache -> Reload

<VirtualHost *:80>
    DocumentRoot "C:/laragon/www/workpulse/dist"
    ServerName workpulse.test
    ServerAlias *.workpulse.test
    <Directory "C:/laragon/www/workpulse/dist">
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
</VirtualHost>

# Optional: HTTPS Virtual Host (Laragon SSL enabled via Menu -> Apache -> SSL -> Enabled)
<VirtualHost *:443>
    DocumentRoot "C:/laragon/www/workpulse/dist"
    ServerName workpulse.test
    ServerAlias *.workpulse.test
    <Directory "C:/laragon/www/workpulse/dist">
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    SSLEngine on
    SSLCertificateFile "C:/laragon/etc/ssl/default.crt"
    SSLCertificateKeyFile "C:/laragon/etc/ssl/default.key"
</VirtualHost>

# ALTERNATIVE: Reverse Proxy mode for Vite Dev Server (running on port 3000)
# Uncomment the block below if you prefer proxying http://workpulse.test -> http://localhost:3000
#
# <VirtualHost *:80>
#     ServerName workpulse.test
#     ProxyPreserveHost On
#     ProxyPass / http://localhost:3000/
#     ProxyPassReverse / http://localhost:3000/
# </VirtualHost>
